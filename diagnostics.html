<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connection check · Drevia</title><link rel="stylesheet" href="app.css"><script src="connection.js"></script></head><body><main class="tool" id="app"></main><script src="app.js"></script><script>
document.getElementById('app').innerHTML='<h1>Connection check</h1><p>No personal files are uploaded by these checks.</p><button class="primary" id="check">Run checks</button><button id="refresh">Clear Drevia cached app files & reload</button><pre id="report" role="status" style="white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:white;border-radius:12px"></pre><p>Local setup: extract the entire ZIP, run START-WINDOWS.cmd, keep its window open, then use http://localhost:3000. A static web host can run local tools but cannot run OCR.</p><p>Subfolder hosting: proxy the entire folder, including api/, to the Node app with the prefix removed. Do not configure a catch-all HTML response for api/ or lib/.</p>';
async function check(){const lines=['Address: '+location.href,'Secure context: '+window.isSecureContext,''];const render=()=>document.getElementById('report').textContent=lines.join('\n');render();
try{const h=await DreviaConnection.request('api/health',{timeout:8000});lines.push('PASS · Backend '+h.status,'OCR models: '+JSON.stringify(h.ocrLanguages),'Missing assets: '+(h.missingAssets?.join(', ')||'none'));}catch(e){lines.push('BACKEND · '+e.message)}render();
if(location.protocol!=='file:')for(const file of ['lib/qrcode.min.js','lib/pdf.worker.min.js','lib/ffmpeg-core.wasm']){try{const r=await fetch(new URL(file,DreviaConnection.base),{method:'HEAD',cache:'no-store'});lines.push((r.ok&&!r.headers.get('content-type')?.includes('text/html')?'PASS':'FAIL')+' · '+file+' · HTTP '+r.status+' · '+r.headers.get('content-type'));}catch(e){lines.push('FAIL · '+file+' could not be reached.')}render();}}
document.getElementById('check').onclick=check;
document.getElementById('refresh').onclick=async()=>{try{if('caches' in window)for(const k of await caches.keys())if(k.startsWith('drevia-'))await caches.delete(k);if('serviceWorker' in navigator)for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===DreviaConnection.base.href)await r.unregister();location.reload();}catch(e){document.getElementById('report').textContent=e.message;}};check();
</script></body></html>
