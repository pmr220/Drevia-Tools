<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1226"><meta name="description" content="Merge, split and reorder PDF files privately on your device."><title>Merge PDFs · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="app.css"></head><body><main id="app"></main><script src="connection.js"></script><script src="app.js"></script><script>const $=App.$;
App.init({title:'Merge, Split &amp; Reorder PDFs',
sub:'Join several PDFs into one, put them in any order, and keep only the pages you need. Text stays selectable. Nothing is uploaded.',
hint:'PDF files',accept:'application/pdf,.pdf',multiple:true,
test:f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name),action:'Merge PDFs',
options:`<label>Pages to keep (optional)<input id="pages" placeholder="e.g. 1-3, 5, 8-10" autocomplete="off"></label>
<label>Output name<input id="name" value="merged" autocomplete="off"></label>`,
note:'Add just one PDF and fill in "Pages to keep" to split out or delete pages. Page numbers count the merged file from page 1. Password-protected PDFs must be unlocked first.',
run:async(files,{status,progress})=>{
  await App.lib('pdflib');
  const {PDFDocument}=PDFLib;let out=await PDFDocument.create();
  for(let i=0;i<files.length;i++){
    status('Reading '+files[i].name+'…');progress(i/files.length*90);
    let src;try{src=await PDFDocument.load(await files[i].arrayBuffer())}
    catch(e){throw new Error('"'+files[i].name+'" is password-protected or damaged, so it cannot be merged.')}
    (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));await App.tick();
  }
  const pr=$('pages').value.trim(),total=out.getPageCount();
  if(pr){
    const idx=[];
    for(const part of pr.split(',')){
      const [a,b]=part.split('-').map(s=>parseInt(s)),e=isNaN(b)?a:b;
      if(isNaN(a)||a<1||e>total||e<a)throw new Error('"'+part.trim()+'" is not a valid page range. The merged file has '+total+' pages.');
      for(let p=a;p<=e;p++)idx.push(p-1);
    }
    const o2=await PDFDocument.create();(await o2.copyPages(out,idx)).forEach(p=>o2.addPage(p));out=o2;
  }
  const blob=new Blob([await out.save()],{type:'application/pdf'}),name=App.safe($('name').value,'merged')+'.pdf';
  return{blob,name,summary:out.getPageCount()+' pages · '+App.fmt(blob.size)+' — '+name};
}});
</script></body></html>
