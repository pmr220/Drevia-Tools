<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Extract editable text from images, screenshots and scanned PDF pages. English and Hindi OCR."><title>Image & PDF to Editable Text · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script src="lib/pdf.min.js"></script><script src="lib/jspdf.min.js"></script><script src="lib/jszip.min.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('Image & PDF to Editable Text','Turn scanned pages, screenshots and photos into text you can copy, edit and download. Supports English, Hindi or both.'));
const $=App.$,app=$('app');app.innerHTML=`
<div class="panel"><div class="mini-label">Choose documents</div><label class="field" style="margin-top:12px">Images or scanned PDFs<input type="file" id="files" multiple accept="image/jpeg,image/png,image/webp,image/bmp,image/tiff,application/pdf,.pdf,.jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff"></label><div class="control-grid" style="margin-top:14px"><label class="field">Text language<select id="lang"><option value="eng">English</option><option value="hin">Hindi</option><option value="eng+hin">English + Hindi</option></select></label><label class="field">PDF scan quality<select id="quality"><option value="1.25">Balanced — faster</option><option value="1.65" selected>Clear — recommended</option><option value="2">High detail — slower</option></select></label></div><div id="fileList" class="detail" style="margin-top:10px">No files selected.</div><div class="button-row" style="margin-top:16px"><button id="extract" class="primary" disabled>Extract text</button><button id="clear" class="secondary" type="button">Clear</button></div><progress id="prog" max="100" value="0" hidden style="width:100%;margin-top:14px"></progress><div id="status" class="status-line" role="status" aria-live="polite"></div></div>
<div class="panel" id="resultPanel" hidden><div class="mini-label">Extracted text</div><p class="muted">Review and edit text before TXT/DOCX export. Searchable PDF retains scanned images and the original OCR layer; edits in this text box do not change it. OCR quality depends on image sharpness, orientation, language and handwriting.</p><label class="field">Editable result<textarea id="textOut" rows="13" placeholder="Extracted text will appear here…" spellcheck="false"></textarea></label><div class="button-row" style="margin-top:13px"><button class="primary" id="copy">Copy text</button><button id="txt" class="secondary">Download TXT</button><button id="docx" class="secondary">Download DOCX</button><button id="pdf" class="secondary">Download searchable PDF</button></div></div>
<div class="hint-box"><b>How privacy works:</b> selected images/pages are sent to this site's OCR API for recognition. The API holds the image only in memory for the request; it does not write uploaded files to disk or save the extracted text in a database. OCR needs an internet connection to your deployed site. Maximum individual page-image size: 18 MB.</div>`;
const fileInput=$('files');let chosen=[],searchablePages=[];fileInput.onchange=()=>{chosen=[...fileInput.files];$('fileList').textContent=chosen.length?chosen.map(f=>`${f.name} · ${App.fmt(f.size)}`).join(' | '):'No files selected.';$('extract').disabled=!chosen.length;$('status').textContent='';$('resultPanel').hidden=true;};
$('clear').onclick=()=>{chosen=[];fileInput.value='';$('fileList').textContent='No files selected.';$('extract').disabled=true;$('prog').hidden=true;$('status').textContent='';$('textOut').value='';$('resultPanel').hidden=true;};
function pdfJsSetup(){if(!window.pdfjsLib)throw new Error('The local PDF reader did not load. Please upload the full project folder.');pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js'}
async function requestOcr(blob,name,lang){const form=new FormData();form.append('image',blob,name);form.append('language',lang);return DreviaConnection.request('api/ocr',{method:'POST',body:form});}
async function ocrPage(blob,name,lang){const data=await requestOcr(blob,name,lang);if(data.pdf)searchablePages.push(data.pdf);return data.text}
$('extract').onclick=async()=>{const lang=$('lang').value,scale=+$('quality').value,st=$('status'),prog=$('prog');st.className='status-line';prog.hidden=false;prog.value=0;$('extract').disabled=true;$('resultPanel').hidden=true;const output=[];let taskCount=0;searchablePages=[];$('files').disabled=$('clear').disabled=$('lang').disabled=$('quality').disabled=true;try{await DreviaConnection.request('api/health',{timeout:8000});
for(const f of chosen){st.textContent='Preparing '+f.name+'…';const ext=(f.name.split('.').pop()||'').toLowerCase();if(f.type==='application/pdf'||ext==='pdf'){pdfJsSetup();const pdf=await pdfjsLib.getDocument({isEvalSupported:false,data:await f.arrayBuffer()}).promise;if(pdf.numPages>30)throw new Error(`${f.name} has ${pdf.numPages} pages. This tool processes up to 30 pages per PDF; split it first.`);for(let p=1;p<=pdf.numPages;p++){taskCount++;st.textContent=`Reading ${f.name} — page ${p} of ${pdf.numPages}…`;const page=await pdf.getPage(p),viewport=page.getViewport({scale}),canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport}).promise;const blob=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('Could not prepare PDF page '+p+'.')),'image/jpeg',.9));canvas.width=canvas.height=0;const text=await ocrPage(blob,`page-${p}.jpg`,lang);output.push(`--- ${f.name} · page ${p} ---\n${text}`);prog.value=Math.min(99,Math.round((chosen.indexOf(f)+p/pdf.numPages)/chosen.length*100));}}
else{if(f.size>18*1024*1024)throw new Error(`${f.name} is larger than 18 MB. Resize it or use a smaller copy first.`);if(!/^image\/(jpeg|png|webp|bmp|tiff)$/.test(f.type)&&!/\.(jpe?g|png|webp|bmp|tif|tiff)$/i.test(f.name))throw new Error(`${f.name} is not a supported image type.`);taskCount++;st.textContent='Recognizing text in '+f.name+'…';const text=await ocrPage(f,f.name,lang);output.push(`--- ${f.name} ---\n${text}`);prog.value=Math.round((chosen.indexOf(f)+1)/chosen.length*100);}}
$('textOut').value=output.join('\n\n');$('resultPanel').hidden=false;prog.value=100;st.textContent=`Finished. Processed ${chosen.length} file(s) into editable text.`;$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'});
}catch(e){st.textContent=e.message||'Text extraction failed. Try a clearer image or fewer pages.';st.className='status-line error'}finally{$('files').disabled=$('clear').disabled=$('lang').disabled=$('quality').disabled=false;$('extract').disabled=!chosen.length;setTimeout(()=>{prog.hidden=true},800)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('textOut').value);$('status').textContent='Text copied to clipboard.'}catch(e){$('textOut').focus();$('textOut').select();$('status').textContent='Select the text and use Copy on your device.'}};
$('txt').onclick=()=>App.save(new Blob([$('textOut').value],{type:'text/plain;charset=utf-8'}),'extracted-text.txt');
function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
$('docx').onclick=async()=>{try{const zip=new JSZip(),lines=$('textOut').value.split(/\r?\n/);const paras=lines.map(line=>line?`<w:p><w:r><w:t xml:space="preserve">${xmlEscape(line)}</w:t></w:r></w:p>`:'<w:p/>').join('');zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');zip.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`);zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');await App.save(await zip.generateAsync({type:'blob'}),'extracted-text.docx');}catch(e){$('status').textContent='Could not create DOCX: '+e.message;$('status').className='status-line error'}};
$('pdf').onclick=async()=>{try{if(!searchablePages.length)throw new Error('Run OCR first to create a searchable PDF.');await App.lib('pdflib');const out=await PDFLib.PDFDocument.create();for(const encoded of searchablePages){const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const source=await PDFLib.PDFDocument.load(bytes);for(const p of await out.copyPages(source,source.getPageIndices()))out.addPage(p);}await App.save(new Blob([await out.save()],{type:'application/pdf'}),'searchable-document.pdf')}catch(e){$('status').textContent=e.message;$('status').className='status-line error'}};

</script></body></html>
