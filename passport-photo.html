<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Format a photo to common passport, ID and application sizes and create a printable photo sheet."><title>Passport & ID Photo Formatter · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script src="lib/jspdf.min.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('Passport & ID Photo Formatter','Prepare a photo for applications and print multiple copies on one page. Select exact pixel dimensions, framing and a simple background color.'));
const $=App.$,app=$('app');app.innerHTML=`<div class="panel"><div class="mini-label">Photo settings</div><label class="field" style="margin-top:12px">Choose a photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp"></label><div class="control-grid" style="margin-top:14px"><label class="field">Photo preset<select id="preset"><option value="413,531">Passport-style portrait · 413 × 531 px</option><option value="600,600">Square ID · 600 × 600 px</option><option value="300,400">Portrait ID · 300 × 400 px</option><option value="200,230">Application photo · 200 × 230 px</option><option value="custom">Custom pixel size</option></select></label><label class="field">Framing<select id="fit"><option value="crop">Crop to fill</option><option value="fit">Fit whole photo</option><option value="stretch">Stretch to size</option></select></label><label class="field">Width (pixels)<input id="w" type="number" min="50" max="3000" value="413" inputmode="numeric"></label><label class="field">Height (pixels)<input id="h" type="number" min="50" max="3000" value="531" inputmode="numeric"></label><label class="field">Background / padding color<select id="bg"><option value="#ffffff">White</option><option value="#d9eaff">Light blue</option><option value="#2b5b95">Blue</option><option value="#f2e6d1">Warm neutral</option></select></label><label class="field">Output format<select id="fmt"><option value="jpg">JPG (smaller file)</option><option value="png">PNG</option></select></label></div><div class="button-row" style="margin-top:15px"><button class="primary" id="previewBtn">Prepare photo</button><button id="download" class="secondary" disabled>Download photo</button><button id="sheet" class="secondary" disabled>Make A4 print sheet</button></div><div id="status" class="status-line" role="status" aria-live="polite"></div></div><div class="panel"><div class="mini-label">Preview</div><div class="output-preview" style="margin-top:12px"><canvas id="out" width="413" height="531" style="max-width:100%;max-height:480px;object-fit:contain"></canvas></div><p class="note">This tool crops and formats the photo; it does not automatically remove the original background behind a person. Confirm the exact dimensions and background rules required by the application before submitting.</p></div>`;
const canvas=$('out'),ctx=canvas.getContext('2d');let source=null,prepared=false;
$('preset').onchange=()=>{if($('preset').value!=='custom'){const [w,h]=$('preset').value.split(',');$('w').value=w;$('h').value=h;}};
$('file').onchange=async()=>{const f=$('file').files[0];prepared=false;$('download').disabled=$('sheet').disabled=true;if(!f)return;try{source=await App.loadImage(f);$('status').textContent=`Loaded ${f.name} · ${source.naturalWidth} × ${source.naturalHeight} px. Choose settings and prepare the photo.`}catch(e){source=null;$('status').textContent=e.message;$('status').className='status-line error'}};
function render(){if(!source)throw new Error('Choose a photo first.');const W=Math.round(+$('w').value),H=Math.round(+$('h').value);if(!(W>=50&&H>=50&&W<=3000&&H<=3000))throw new Error('Width and height must be between 50 and 3000 pixels.');canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,W,H);const iw=source.naturalWidth,ih=source.naturalHeight;let r=$('fit').value==='stretch'?null:$('fit').value==='crop'?Math.max(W/iw,H/ih):Math.min(W/iw,H/ih);if(r===null)ctx.drawImage(source,0,0,W,H);else{const dw=iw*r,dh=ih*r;ctx.drawImage(source,(W-dw)/2,(H-dh)/2,dw,dh)}prepared=true;$('download').disabled=$('sheet').disabled=false;canvas.style.width=Math.min(100,480*W/H)+'%';$('status').textContent=`Ready · ${W} × ${H} pixels. Download this photo or prepare a printable A4 sheet.`;}
$('previewBtn').onclick=()=>{try{render()}catch(e){$('status').textContent=e.message;$('status').className='status-line error'}};
function imageBlob(){return new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('Could not export this image.')),$('fmt').value==='png'?'image/png':'image/jpeg',.94))}
$('download').onclick=async()=>{try{if(!prepared)render();const b=await imageBlob();await App.save(b,`id-photo-${canvas.width}x${canvas.height}.${$('fmt').value}`)}catch(e){$('status').textContent=e.message;$('status').className='status-line error'}};
$('sheet').onclick=async()=>{try{if(!prepared)render();await App.lib('jspdf');const {jsPDF}=window.jspdf;const data=canvas.toDataURL('image/jpeg',.95),doc=new jsPDF({unit:'mm',format:'a4'}),pageW=210,pageH=297,margin=12,gap=4,w=35,h=w*canvas.height/canvas.width;const cols=Math.max(1,Math.floor((pageW-2*margin+gap)/(w+gap))),rows=Math.max(1,Math.floor((pageH-2*margin+gap)/(h+gap)));if(w>pageW-2*margin||h>pageH-2*margin)throw new Error('This photo ratio is too large for a multi-photo sheet. Choose a portrait or square size.');const total=cols*rows;doc.setFontSize(9);doc.text(`${total} photo copies · ${canvas.width} × ${canvas.height} px`,margin,8);for(let i=0;i<total;i++){const x=margin+(i%cols)*(w+gap),y=margin+Math.floor(i/cols)*(h+gap);doc.addImage(data,'JPEG',x,y,w,h);doc.setDrawColor(170);doc.setLineWidth(.15);doc.rect(x,y,w,h)}await App.save(doc.output('blob'),'id-photo-print-sheet-a4.pdf');$('status').textContent=`Created an A4 sheet with ${total} photo copies.`}catch(e){$('status').textContent=e.message;$('status').className='status-line error'}};
</script></body></html>
