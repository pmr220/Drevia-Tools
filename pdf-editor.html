<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Annotate, sign, highlight, draw on PDFs and permanently redact by flattening edited pages to a new image-only PDF."><title>PDF Editor & Privacy Tool · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script src="lib/pdf.min.js"></script><script src="lib/jspdf.min.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('PDF Editor & Privacy Tool','Add notes, signatures, highlights and redaction boxes. The final export is flattened into page images, so content covered by redaction boxes is no longer embedded as selectable text.'));
const $=App.$,app=$('app');app.innerHTML=`
<div class="panel"><div class="mini-label">Open a PDF</div><label class="field" style="margin-top:12px">PDF document<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><div class="hint-box" style="margin-top:12px">For privacy, export rebuilds each page as a flattened image-based PDF. This removes original selectable text and metadata and makes drawn black redaction boxes permanent in the exported file. Save a separate original if you need editable text later.</div><div id="status" class="status-line" role="status" aria-live="polite"></div></div>
<section class="panel" id="editor" hidden><div class="mini-label">Edit page</div><div class="control-grid" style="margin-top:12px"><label class="field">Tool<select id="mode"><option value="view">View / move around</option><option value="text">Add text or date</option><option value="highlight">Highlight area</option><option value="draw">Freehand draw</option><option value="redact">Permanent redaction (black)</option><option value="image">Place a signature / image</option></select></label><label class="field">Text to add<input id="textToAdd" placeholder="Type a note or date"></label><label class="field">Text size<select id="textSize"><option value="14">Small</option><option value="20" selected>Medium</option><option value="28">Large</option></select></label><label class="field">Ink / highlight color<input id="color" type="color" value="#0e3a73"></label><label class="field">Signature / image PNG<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Page number<input id="pageNo" type="number" min="1" value="1" inputmode="numeric"></label></div><div class="button-row" style="margin-top:14px"><button id="prev" class="secondary">← Previous</button><span class="tag" id="pageTag">Page 1 of 1</span><button id="next" class="secondary">Next →</button><button id="undo" class="secondary">Undo on this page</button><button id="clearPage" class="secondary danger">Clear page edits</button></div><p class="detail">Choose a tool, then tap or drag on the page. On touch devices, use one finger. For redaction, drag across the complete sensitive area.</p><div class="page-stage" id="stage" style="margin-top:12px"><canvas id="pageCanvas"></canvas><canvas id="overlayCanvas" class="overlay-canvas"></canvas></div><div class="button-row" style="margin-top:16px"><button id="export" class="primary">Export flattened PDF</button><button id="clearAll" class="secondary danger">Clear all edits</button></div><progress id="prog" max="100" value="0" hidden style="width:100%;margin-top:14px"></progress><p class="note">The export is a new flattened PDF. Original text will no longer be selectable, and the original source file is never modified.</p></section>`;
const status=$('status'),pdfInput=$('pdfFile'),base=$('pageCanvas'),overlay=$('overlayCanvas'),bctx=base.getContext('2d'),octx=overlay.getContext('2d');let pdf=null,current=1,annotations={},busy=false,imageData=null,drag=null,previewScale=1.25;const annotationImages=new Map();
function loadAnnotationImage(data){if(annotationImages.has(data)){const cached=annotationImages.get(data);if(cached.complete&&cached.naturalWidth)return Promise.resolve(cached);return new Promise((resolve,reject)=>{cached.addEventListener('load',()=>resolve(cached),{once:true});cached.addEventListener('error',reject,{once:true})})}return new Promise((resolve,reject)=>{const im=new Image();annotationImages.set(data,im);im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Could not load the signature image.'));im.src=data})}
function say(t,err=false){status.textContent=t;status.className='status-line'+(err?' error':'')}
function libReady(){if(!window.pdfjsLib)throw new Error('The local PDF reader did not load.');pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';}
function list(){return annotations[current]||(annotations[current]=[])}
function drawAnnotations(ctx,w,h,items){items.forEach(a=>{const x=a.x*w,y=a.y*h;if(a.type==='text'){ctx.save();ctx.fillStyle=a.color||'#10213d';ctx.font=`${Math.max(13,a.size*w)}px Arial, sans-serif`;ctx.textBaseline='alphabetic';ctx.fillText(a.text,x,y);ctx.restore()}else if(a.type==='highlight'||a.type==='redact'){ctx.save();const bw=a.w*w,bh=a.h*h;if(a.type==='redact'){ctx.fillStyle='#000';ctx.fillRect(x,y,bw,bh)}else{ctx.fillStyle=a.color||'#ffdf5d';ctx.globalAlpha=.42;ctx.fillRect(x,y,bw,bh)}ctx.restore()}else if(a.type==='draw'){ctx.save();ctx.strokeStyle=a.color||'#0e3a73';ctx.lineWidth=Math.max(2,w*.003);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();a.points.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x*w,p.y*h);else ctx.lineTo(p.x*w,p.y*h)});ctx.stroke();ctx.restore()}else if(a.type==='image'){const cached=annotationImages.get(a.data);if(cached&&cached.complete&&cached.naturalWidth){const iw=a.w*w,ih=iw*cached.height/cached.width;ctx.drawImage(cached,x,y,iw,ih)}else loadAnnotationImage(a.data).then(()=>{if(ctx===octx)redrawOverlay()}).catch(()=>{})}})}
async function renderPage(n){if(!pdf)return;current=Math.max(1,Math.min(pdf.numPages,n));$('pageNo').value=current;$('pageTag').textContent=`Page ${current} of ${pdf.numPages}`;$('prev').disabled=current<=1;$('next').disabled=current>=pdf.numPages;say('Rendering page '+current+'…');const page=await pdf.getPage(current),v=page.getViewport({scale:previewScale});base.width=Math.ceil(v.width);base.height=Math.ceil(v.height);base.style.width=base.width+'px';base.style.height='auto';overlay.width=base.width;overlay.height=base.height;overlay.style.width=base.width+'px';overlay.style.height='auto';await page.render({canvasContext:bctx,viewport:v}).promise;redrawOverlay();say('Choose a tool and tap or drag directly on the page.');}
function redrawOverlay(){octx.clearRect(0,0,overlay.width,overlay.height);drawAnnotations(octx,overlay.width,overlay.height,list());if(drag){if(drag.type==='draw'){octx.save();octx.strokeStyle=$('color').value;octx.lineWidth=Math.max(2,overlay.width*.003);octx.beginPath();drag.points.forEach((p,i)=>i?octx.lineTo(p.x*overlay.width,p.y*overlay.height):octx.moveTo(p.x*overlay.width,p.y*overlay.height));octx.stroke();octx.restore()}else if(drag.type==='highlight'||drag.type==='redact'){const x=Math.min(drag.x,drag.cx)*overlay.width,y=Math.min(drag.y,drag.cy)*overlay.height,w=Math.abs(drag.cx-drag.x)*overlay.width,h=Math.abs(drag.cy-drag.y)*overlay.height;octx.save();octx.fillStyle=drag.type==='redact'?'#000':$('color').value;octx.globalAlpha=drag.type==='redact'?1:.42;octx.fillRect(x,y,w,h);octx.restore()}}}
function at(e){const r=overlay.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
overlay.addEventListener('pointerdown',e=>{if(!pdf||busy)return;const mode=$('mode').value;if(mode==='view')return;e.preventDefault();overlay.setPointerCapture(e.pointerId);const p=at(e);if(mode==='text'){const text=$('textToAdd').value.trim()||prompt('Text or date to place on this page:','');if(!text)return;list().push({type:'text',x:p.x,y:p.y,text:String(text).slice(0,300),size:(+$('textSize').value)/overlay.width,color:$('color').value});redrawOverlay();return;}if(mode==='image'){if(!imageData){say('Upload a signature or image PNG first.',true);return}list().push({type:'image',x:p.x,y:p.y,w:.24,data:imageData});redrawOverlay();return;}drag={type:mode,x:p.x,y:p.y,cx:p.x,cy:p.y,points:mode==='draw'?[p]:[]};redrawOverlay();});
overlay.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=at(e);drag.cx=p.x;drag.cy=p.y;if(drag.type==='draw')drag.points.push(p);redrawOverlay()});function finishDrag(){if(!drag)return;const d=drag;drag=null;if(d.type==='draw'){if(d.points.length>1)list().push({type:'draw',points:d.points,color:$('color').value})}else{const x=Math.min(d.x,d.cx),y=Math.min(d.y,d.cy),w=Math.abs(d.cx-d.x),h=Math.abs(d.cy-d.y);if(w>.003&&h>.003)list().push({type:d.type,x,y,w,h,color:$('color').value})}redrawOverlay()}['pointerup','pointercancel','lostpointercapture'].forEach(e=>overlay.addEventListener(e,finishDrag));
pdfInput.onchange=async()=>{const f=pdfInput.files[0];if(!f)return;try{libReady();say('Opening PDF…');pdf=await pdfjsLib.getDocument({isEvalSupported:false,data:await f.arrayBuffer()}).promise;if(pdf.numPages>50)throw new Error('This editor supports up to 50 pages at a time. Split larger PDFs first.');annotations={};current=1;$('editor').hidden=false;await renderPage(1);$('editor').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){pdf=null;$('editor').hidden=true;say(e.message||'Could not open this PDF.',true)}};
$('prev').onclick=()=>renderPage(current-1);$('next').onclick=()=>renderPage(current+1);$('pageNo').onchange=()=>renderPage(Math.max(1,Math.min(pdf?.numPages||1,+$('pageNo').value||1)));$('undo').onclick=()=>{list().pop();redrawOverlay()};$('clearPage').onclick=()=>{if(confirm('Remove all edits on this page?')){annotations[current]=[];redrawOverlay()}};$('imageFile').onchange=async e=>{const f=e.target.files[0];if(!f){imageData=null;return}if(f.size>10*1024*1024){say('Choose an image under 10 MB.',true);e.target.value='';return}const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});imageData=d;say('Image ready. Select “Place a signature / image” and tap the page.')};
async function exportPdf(){if(!pdf||busy)return;busy=true;$('export').disabled=true;$('clearAll').disabled=true;const prog=$('prog');prog.hidden=false;prog.value=0;try{await App.lib('jspdf');const {jsPDF}=window.jspdf;let doc=null;for(let i=1;i<=pdf.numPages;i++){say(`Preparing flattened page ${i} of ${pdf.numPages}…`);const page=await pdf.getPage(i),v=page.getViewport({scale:1.4}),pageSize=page.getViewport({scale:1}),canvas=document.createElement('canvas');canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport:v}).promise;await Promise.all((annotations[i]||[]).filter(a=>a.type==='image').map(a=>loadAnnotationImage(a.data)));drawAnnotations(ctx,canvas.width,canvas.height,annotations[i]||[]);const img=canvas.toDataURL('image/png');const pageW=pageSize.width,pageH=pageSize.height;const orient=pageW>pageH?'l':'p';if(!doc)doc=new jsPDF({orientation:orient,unit:'pt',format:[pageW,pageH],compress:true});else doc.addPage([pageW,pageH],orient);doc.addImage(img,'PNG',0,0,pageW,pageH,undefined,'FAST');canvas.width=canvas.height=0;prog.value=Math.round(i/pdf.numPages*100);await App.tick()}say('Preparing final PDF…');const blob=doc.output('blob');const orig=pdfInput.files[0];await App.save(blob,(orig.name.replace(/\.pdf$/i,'')||'document')+'-edited-flattened.pdf');say('Done. The exported PDF contains flattened page images. Inspect every redaction before sharing.');}catch(e){say(e.message||'Could not export this PDF. Try fewer pages or a smaller source file.',true)}finally{busy=false;$('export').disabled=false;$('clearAll').disabled=false;prog.hidden=true}}
$('export').onclick=exportPdf;$('clearAll').onclick=()=>{if(confirm('Clear edits from every page?')){annotations={};redrawOverlay();say('All edits cleared.')}};
</script></body></html>
