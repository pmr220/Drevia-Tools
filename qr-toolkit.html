<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Create QR codes for Wi-Fi, websites, contact cards, email, phone numbers and WhatsApp. Generate batches from CSV."><title>QR Code & Wi-Fi Sharing · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script src="lib/qrcode.min.js"></script><script src="lib/jszip.min.js"></script><script src="lib/jspdf.min.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('QR Code & Wi-Fi Sharing Toolkit','Create scannable QR codes for everyday sharing. Choose what to encode, style the result, and save PNG, SVG or PDF — no account needed.'));
const $=App.$;const app=$('app');
app.innerHTML=`<div class="panel"><div class="mini-label">Create one QR code</div><div class="control-grid" style="margin-top:13px"><label class="field">What do you want to share?<select id="kind"><option value="url">Website link</option><option value="wifi">Wi-Fi access</option><option value="contact">Contact card (vCard)</option><option value="whatsapp">WhatsApp message</option><option value="email">Email</option><option value="phone">Phone number</option><option value="text">Plain text</option></select></label><label class="field">Download format<select id="format"><option value="png">PNG image</option><option value="svg">SVG vector</option><option value="pdf">PDF printout</option></select></label><div id="fields" class="control-grid full"></div><label class="field">QR code color<input id="dark" type="color" value="#10213d"></label><label class="field">Background color<input id="light" type="color" value="#ffffff"></label><label class="field">Image size<select id="size"><option value="512">512 × 512</option><option value="1024" selected>1024 × 1024</option><option value="1600">1600 × 1600</option></select></label><label class="field">File name<input id="filename" value="drevia-qr" maxlength="70"></label></div><div class="button-row" style="margin-top:17px"><button class="primary" id="make">Generate QR code</button><button id="reset" class="secondary">Reset</button></div><div id="status" class="status-line" role="status" aria-live="polite"></div></div>
<section id="singleResult" class="panel" hidden><div class="mini-label">Your QR code</div><div class="output-preview" style="margin:12px 0"><img id="preview" alt="Generated QR code"></div><div class="button-row"><button class="primary" id="saveSingle">Download QR</button><button id="savePng" class="secondary">PNG</button><button id="saveSvg" class="secondary">SVG</button><button id="savePdf" class="secondary">PDF</button></div><p class="note">For printing, choose SVG or PDF. For sharing in a chat, PNG is usually the easiest.</p></section>
<section class="panel"><div class="mini-label">Batch QR codes from a CSV</div><h2 style="margin-top:7px">Create many in one go</h2><p class="muted">Upload a CSV with two columns: <b>name</b> and <b>value</b>. Each row becomes a QR image and the results are packed into a ZIP on your device.</p><label class="field">Choose CSV file<input type="file" id="csv" accept=".csv,text/csv"></label><div class="control-grid" style="margin-top:13px"><label class="field">Batch format<select id="batchFormat"><option value="png">PNG images</option><option value="svg">SVG vector images</option></select></label><label class="field">ZIP file name<input id="zipname" value="qr-code-batch" maxlength="70"></label></div><div class="button-row" style="margin-top:14px"><button class="primary" id="makeBatch">Generate QR ZIP</button><a href="data:text/csv;charset=utf-8,name%2Cvalue%0AWebsite%2Chttps%3A%2F%2Fexample.com%0AHelp%20WhatsApp%2Chttps%3A%2F%2Fwa.me%2F911234567890" download="qr-sample.csv" class="secondary" style="display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 16px;min-height:44px">Download sample CSV</a></div><div id="batchStatus" class="status-line" role="status" aria-live="polite"></div></section>
<div class="hint-box"><b>Privacy note:</b> single and batch QR codes are generated in your browser using the bundled local QR library. The contents you enter, including Wi-Fi details, are not sent to the server.</div>`;
const fields=$('fields');
const templates={url:`<label class="field full">Website URL<input id="v_url" type="url" placeholder="https://example.com" autocomplete="url"></label>`,wifi:`<label class="field">Wi-Fi network name (SSID)<input id="v_ssid" placeholder="Network name" autocomplete="off"></label><label class="field">Password<input id="v_password" type="text" placeholder="Wi-Fi password" autocomplete="off"></label><label class="field">Security type<select id="v_security"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">No password</option></select></label>`,contact:`<label class="field">Full name<input id="v_name" placeholder="Full name"></label><label class="field">Phone<input id="v_phone" type="tel" placeholder="+91…"></label><label class="field">Email<input id="v_email" type="email" placeholder="name@example.com"></label><label class="field">Organization (optional)<input id="v_org" placeholder="Company / institute"></label>`,whatsapp:`<label class="field">WhatsApp number<input id="v_wa" type="tel" placeholder="91XXXXXXXXXX"></label><label class="field">Pre-filled message<input id="v_msg" placeholder="Hello! I am interested…"></label>`,email:`<label class="field">Email address<input id="v_email" type="email" placeholder="name@example.com"></label><label class="field">Subject<input id="v_subject" placeholder="Subject"></label><label class="field full">Message<textarea id="v_body" placeholder="Optional message"></textarea></label>`,phone:`<label class="field full">Phone number<input id="v_phone" type="tel" placeholder="+91…"></label>`,text:`<label class="field full">Text to encode<textarea id="v_text" placeholder="Type or paste text"></textarea></label>`};
function renderFields(){fields.innerHTML=templates[$('kind').value];}renderFields();$('kind').onchange=renderFields;
let currentPayload='',currentBlob=null,currentName='drevia-qr.png',currentSvg='';
const safeName=(x,d)=>String(x||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-').slice(0,70)||d;
function escWifi(v){return String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/:/g,'\\:').replace(/"/g,'\\"');}
function payloadFromForm(){const k=$('kind').value;const val=id=>($(id)?.value||'').trim();let p='';
if(k==='url'){p=val('v_url');if(!/^https?:\/\//i.test(p))throw new Error('Enter a full website address starting with http:// or https://.');}
if(k==='wifi'){const ssid=val('v_ssid');if(!ssid)throw new Error('Enter the Wi-Fi network name.');const sec=val('v_security');p=`WIFI:T:${sec};S:${escWifi(ssid)};P:${sec==='nopass'?'':escWifi(val('v_password'))};;`;}
if(k==='contact'){const n=val('v_name');if(!n&&!val('v_phone')&&!val('v_email'))throw new Error('Enter at least a name, phone number or email.');p='BEGIN:VCARD\nVERSION:3.0\nFN:'+n+'\n'+(val('v_phone')?'TEL;TYPE=CELL:'+val('v_phone')+'\n':'')+(val('v_email')?'EMAIL:'+val('v_email')+'\n':'')+(val('v_org')?'ORG:'+val('v_org')+'\n':'')+'END:VCARD';}
if(k==='whatsapp'){let n=val('v_wa').replace(/[^0-9]/g,'');if(n.length<8)throw new Error('Enter a WhatsApp number with country code.');p='https://wa.me/'+n+(val('v_msg')?'?text='+encodeURIComponent(val('v_msg')):'');}
if(k==='email'){const e=val('v_email');if(!e.includes('@'))throw new Error('Enter a valid email address.');p='mailto:'+e+(val('v_subject')||val('v_body')?'?'+[val('v_subject')?'subject='+encodeURIComponent(val('v_subject')):'',val('v_body')?'body='+encodeURIComponent(val('v_body')):''].filter(Boolean).join('&'):'');}
if(k==='phone'){const n=val('v_phone');if(n.replace(/\D/g,'').length<5)throw new Error('Enter a valid phone number.');p='tel:'+n;}
if(k==='text'){p=val('v_text');if(!p)throw new Error('Enter some text to encode.');}return p;}
function getQrMatrix(payload){if(!window.QRCode||typeof QRCode.create!=='function')throw new Error('The local QR library is missing. Run npm install in the project folder and reload.');return QRCode.create(payload,{errorCorrectionLevel:'M'});}
function matrixSvg(matrix,size,dark,light){const n=matrix.modules.size,quiet=4,total=n+quiet*2,scale=size/total;let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(matrix.modules.data[y*n+x])d+=`M${x+quiet} ${y+quiet}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;}
function canvasPng(payload,size,dark,light){return new Promise((resolve,reject)=>{const temp=document.createElement('canvas');QRCode.toCanvas(temp,payload,{width:size,margin:4,errorCorrectionLevel:'M',color:{dark:dark+'ff',light:light+'ff'}},err=>{if(err)return reject(err);temp.toBlob(b=>b?resolve(b):reject(new Error('Could not create PNG.')), 'image/png');});});}
async function makeSingle(){try{const payload=payloadFromForm(),fmt=$('format').value,size=+$('size').value,dark=$('dark').value,light=$('light').value;currentPayload=payload;currentName=safeName($('filename').value,'drevia-qr');$('status').textContent='Generating QR code on this device…';let png=await canvasPng(payload,size,dark,light);currentBlob=png;currentSvg=matrixSvg(getQrMatrix(payload),size,dark,light);if(fmt==='svg'){currentBlob=new Blob([currentSvg],{type:'image/svg+xml'});currentName+='.svg'}else if(fmt==='pdf'){currentName+='.pdf'}else currentName+='.png';const u=URL.createObjectURL(fmt==='svg'?currentBlob:png);$('preview').src=u;$('preview').alt='QR code preview';$('singleResult').hidden=false;$('status').textContent='QR code ready. Choose how you want to save it.';$('saveSingle').textContent='Download '+fmt.toUpperCase();}catch(e){$('status').textContent=e.message||'Could not create this QR code.';$('status').className='status-line error';}}
$('make').onclick=makeSingle;$('reset').onclick=()=>{app.querySelectorAll('input:not([type=color]),textarea').forEach(e=>{if(e.id==='filename')e.value='drevia-qr';else if(e.type==='file')e.value='';else e.value=''});$('kind').value='url';$('format').value='png';$('dark').value='#10213d';$('light').value='#ffffff';$('size').value='1024';$('singleResult').hidden=true;$('status').textContent='';$('status').className='status-line';renderFields()};
async function saveFormat(fmt){try{if(!currentPayload)throw new Error('Generate a QR code first.');let blob,name=safeName($('filename').value,'drevia-qr');if(fmt==='svg'){blob=new Blob([currentSvg],{type:'image/svg+xml'});name+='.svg'}else if(fmt==='png'){blob=await canvasPng(currentPayload,+$('size').value,$('dark').value,$('light').value);name+='.png'}else{await App.lib('jspdf');const png=await canvasPng(currentPayload,Math.max(1024,+$('size').value),$('dark').value,$('light').value);const durl=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(png)});const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});doc.setFontSize(18);doc.text('QR Code',105,22,{align:'center'});doc.addImage(durl,'PNG',60,38,90,90);doc.setFontSize(10);doc.text(name,105,138,{align:'center'});blob=doc.output('blob');name+='.pdf'}await App.save(blob,name);}catch(e){$('status').textContent=e.message||'Could not save this file.';$('status').className='status-line error';}}
$('saveSingle').onclick=()=>saveFormat($('format').value);$('savePng').onclick=()=>saveFormat('png');$('saveSvg').onclick=()=>saveFormat('svg');$('savePdf').onclick=()=>saveFormat('pdf');
function parseCsv(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&q&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v.trim());v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v.trim());if(row.some(x=>x))rows.push(row);row=[];v=''}else v+=c;}row.push(v.trim());if(row.some(x=>x))rows.push(row);if(rows.length&&/^(name|label|title)$/i.test(rows[0][0])&&/^(value|content|url|data|text)$/i.test(rows[0][1]||''))rows.shift();return rows.map(r=>({name:r[0]||'qr-'+(rows.indexOf(r)+1),value:r.slice(1).join(',').trim()})).filter(r=>r.value);}
$('makeBatch').onclick=async()=>{const f=$('csv').files[0];const st=$('batchStatus');try{if(!f)throw new Error('Choose a CSV file first.');const rows=parseCsv(await f.text());if(!rows.length)throw new Error('No rows with values were found. Use columns named name and value.');if(rows.length>100)throw new Error('Please limit each batch to 100 QR codes.');if(typeof JSZip==='undefined')throw new Error('The local ZIP library is missing. Run npm install and reload.');st.textContent='Creating '+rows.length+' QR codes…';const zip=new JSZip(),fmt=$('batchFormat').value;for(let i=0;i<rows.length;i++){const r=rows[i];const matrix=getQrMatrix(r.value);const name=safeName(r.name,'qr-'+(i+1));if(fmt==='svg')zip.file(name+'.svg',matrixSvg(matrix,1024,$('dark').value,$('light').value));else{const blob=await canvasPng(r.value,1024,$('dark').value,$('light').value);zip.file(name+'.png',blob);}st.textContent='Created '+(i+1)+' of '+rows.length+'…';}const blob=await zip.generateAsync({type:'blob'});await App.save(blob,safeName($('zipname').value,'qr-code-batch')+'.zip');st.textContent='Done — '+rows.length+' QR codes packed into a ZIP.';}catch(e){st.textContent=e.message||'Could not generate this batch.';st.className='status-line error';}};
</script></body></html>
