<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Draw a signature, remove a white photo background, create a transparent stamp and place it on a PDF."><title>Signature & Document Stamp Maker · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script src="lib/pdf-lib.min.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('Signature & Document Stamp Maker','Create a reusable signature image or professional name stamp. Save transparent PNGs or place them directly on a PDF.'));
const $=App.$,app=$('app');app.innerHTML=`
<div class="panel"><div class="mini-label">1 · Create a signature</div><p class="muted">Draw with your finger, stylus or mouse. A transparent background is used.</p><div class="canvas-wrap"><canvas id="signature" class="draw-canvas" aria-label="Signature drawing area"></canvas></div><div class="button-row" style="margin-top:12px"><button id="clearDraw" class="secondary">Clear signature</button><button id="downloadSign" class="primary">Download signature PNG</button></div><hr class="tool-divider"><div class="control-grid"><label class="field">Or upload a signature photo<input type="file" id="signPhoto" accept="image/*"></label><div class="field"><span>White-background cleanup</span><button id="removeWhite" class="secondary" type="button">Remove near-white background</button></div></div><div class="hint-box" style="margin-top:12px">Background cleanup is designed for signatures photographed or scanned on a plain white/light background. It is not AI object segmentation; review the transparent result before using it.</div></div>
<div class="panel"><div class="mini-label">2 · Create a document stamp</div><div class="control-grid"><label class="field">Name / organization<input id="stampName" placeholder="Your full name or organization"></label><label class="field">Designation / role<input id="stampRole" placeholder="Manager, Director, Approved…"></label><label class="field">Date<input id="stampDate" type="date"></label><label class="field">Stamp color<select id="stampColor"><option value="#143f80">Professional blue</option><option value="#17764d">Green</option><option value="#8d2424">Red</option><option value="#252a35">Black</option></select></label></div><div class="output-preview" style="margin-top:14px"><canvas id="stampCanvas" style="max-width:100%;height:auto;width:100%;max-height:180px"></canvas></div><div class="button-row" style="margin-top:12px"><button id="makeStamp" class="primary">Refresh stamp</button><button id="downloadStamp" class="secondary">Download stamp PNG</button></div></div>
<div class="panel"><div class="mini-label">3 · Place signature or stamp on a PDF</div><div class="control-grid"><label class="field">PDF file<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><label class="field">Image to place<select id="placeSource"><option value="signature">Signature / cleaned photo</option><option value="stamp">Document stamp</option></select></label><label class="field">Page number<input id="pageNo" type="number" min="1" value="1" inputmode="numeric"></label><label class="field">Image width (PDF points)<input id="placeWidth" type="number" min="30" max="600" value="160" inputmode="numeric"></label><label class="field">Position<select id="placePosition"><option value="bottom-right">Bottom right</option><option value="bottom-left">Bottom left</option><option value="top-right">Top right</option><option value="top-left">Top left</option><option value="center">Center</option></select></label><label class="field">Margin (points)<input id="placeMargin" type="number" min="0" max="200" value="36" inputmode="numeric"></label></div><div class="button-row" style="margin-top:16px"><button id="placePdf" class="primary">Create signed PDF</button></div><div id="placeStatus" class="status-line" role="status" aria-live="polite"></div></div>
<div class="hint-box">Files are processed in your browser. Your PDF is not uploaded. A drawn signature image is not the same as a cryptographically validated digital signature or proof of identity.</div>`;
const sign=$('signature'),ctx=sign.getContext('2d');let drawing=false,hasInk=false,last=null,uploadedClean=null;
function resizeCanvas(){const r=sign.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);const old=hasInk?sign.toDataURL():null;sign.width=Math.max(1,Math.round(r.width*dpr));sign.height=Math.round(190*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10213d';ctx.lineWidth=2.6;if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,sign.clientWidth,sign.clientHeight);im.src=old;}}
resizeCanvas();window.addEventListener('resize',()=>{if(!drawing)resizeCanvas()});
function point(e){const r=sign.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
sign.addEventListener('pointerdown',e=>{e.preventDefault();sign.setPointerCapture(e.pointerId);drawing=true;const p=point(e);last=p;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();hasInk=true;uploadedClean=null});sign.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;hasInk=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>sign.addEventListener(ev,()=>{drawing=false;last=null}));
function clearSign(){ctx.clearRect(0,0,sign.width,sign.height);hasInk=false;uploadedClean=null;$('signPhoto').value=''}$('clearDraw').onclick=clearSign;
function canvasBlob(canvas){return new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('Could not create PNG.')),'image/png'))}
function dataUrlBlob(data){const [head,b64]=data.split(',');const mime=(head.match(/data:(.*?);/)||[])[1]||'image/png';const bytes=atob(b64);const a=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)a[i]=bytes.charCodeAt(i);return new Blob([a],{type:mime})}
$('signPhoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const im=await App.loadImage(f);const dpr=Math.min(window.devicePixelRatio||1,2),cw=sign.clientWidth,ch=190;sign.width=Math.max(1,Math.round(cw*dpr));sign.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);const scale=Math.min(cw/im.naturalWidth,ch/im.naturalHeight);const w=im.naturalWidth*scale,h=im.naturalHeight*scale;ctx.drawImage(im,(cw-w)/2,(ch-h)/2,w,h);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10213d';ctx.lineWidth=2.6;hasInk=true;uploadedClean=null;}catch(err){$('placeStatus').textContent=err.message||'Could not read photo.'}};
$('removeWhite').onclick=()=>{if(!hasInk){$('placeStatus').textContent='Draw a signature or upload a photo first.';return;}const image=ctx.getImageData(0,0,sign.width,sign.height),d=image.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],min=Math.min(r,g,b),max=Math.max(r,g,b);if(r>232&&g>232&&b>225){d[i+3]=0;}else if(r>210&&g>210&&b>200&&max-min<24){const light=Math.max(0,Math.min(1,(max-195)/45));d[i+3]=Math.round(d[i+3]*light);}}ctx.putImageData(image,0,0);uploadedClean=sign.toDataURL('image/png');$('placeStatus').textContent='Near-white pixels made transparent. Review the result before downloading.'};
const stamp=$('stampCanvas'),sctx=stamp.getContext('2d');function drawStamp(){stamp.width=1200;stamp.height=300;sctx.clearRect(0,0,stamp.width,stamp.height);const col=$('stampColor').value;sctx.strokeStyle=col;sctx.fillStyle=col;sctx.lineWidth=8;sctx.strokeRect(14,14,1172,272);sctx.lineWidth=3;sctx.strokeRect(28,28,1144,244);sctx.textAlign='center';sctx.font='bold 58px Arial';sctx.fillText(($('stampName').value.trim()||'NAME / ORGANIZATION').slice(0,35),600,112,1080);sctx.font='bold 37px Arial';sctx.fillText(($('stampRole').value.trim()||'DESIGNATION').slice(0,48),600,173,1080);sctx.font='30px Arial';const dt=$('stampDate').value?new Date($('stampDate').value+'T12:00:00').toLocaleDateString('en-IN'):'DATE';sctx.fillText(dt,600,230,1080);}
$('makeStamp').onclick=drawStamp;['stampName','stampRole','stampDate','stampColor'].forEach(id=>$(id).addEventListener('change',drawStamp));$('stampDate').value=new Date().toISOString().slice(0,10);drawStamp();
$('downloadSign').onclick=async()=>{if(!hasInk){alert('Draw or upload a signature first.');return}await App.save(await canvasBlob(sign),'signature.png')};$('downloadStamp').onclick=async()=>{drawStamp();await App.save(await canvasBlob(stamp),'document-stamp.png')};
function imageForPlace(){return $('placeSource').value==='stamp'?stamp:sign}
$('placePdf').onclick=async()=>{const st=$('placeStatus');st.className='status-line';try{const f=$('pdfFile').files[0];if(!f)throw new Error('Choose a PDF file first.');if(!window.PDFLib)throw new Error('The local PDF library did not load.');if($('placeSource').value==='signature'&&!hasInk)throw new Error('Draw or upload a signature first.');const {PDFDocument}=PDFLib;st.textContent='Opening PDF…';const doc=await PDFDocument.load(await f.arrayBuffer());const pageNo=Math.round(+$('pageNo').value);if(!(pageNo>=1&&pageNo<=doc.getPageCount()))throw new Error('Page number must be between 1 and '+doc.getPageCount()+'.');const source=imageForPlace(),png=await canvasBlob(source),img=await doc.embedPng(await png.arrayBuffer()),page=doc.getPage(pageNo-1),sz=page.getSize();const w=Math.max(30,Math.min(600,+$('placeWidth').value||160)),h=w*img.height/img.width,m=Math.max(0,Math.min(200,+$('placeMargin').value||0));let x=m,y=m;switch($('placePosition').value){case'top-right':x=sz.width-w-m;y=sz.height-h-m;break;case'top-left':x=m;y=sz.height-h-m;break;case'bottom-right':x=sz.width-w-m;y=m;break;case'center':x=(sz.width-w)/2;y=(sz.height-h)/2;break;default:x=m;y=m;}x=Math.max(0,Math.min(sz.width-w,x));y=Math.max(0,Math.min(sz.height-h,y));page.drawImage(img,{x,y,width:w,height:h});st.textContent='Preparing signed PDF…';const bytes=await doc.save();await App.save(new Blob([bytes],{type:'application/pdf'}),App.base(f.name)+'-signed.pdf');st.textContent='Done. Your edited PDF was created locally.';}catch(e){st.textContent=e.message||'Could not create the signed PDF.';st.className='status-line error'}};
</script></body></html>
