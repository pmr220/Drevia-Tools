<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152b"><meta name="description" content="Test your webcam, microphone and recording before online interviews, classes or calls. Works without an account."><title>Webcam & Microphone Tester · Drevia Infotech</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><main id="app" class="tool"></main><script src="connection.js"></script><script src="app.js"></script><script>
App.$('app').insertAdjacentHTML('beforebegin',App.hero('Webcam & Microphone Tester','Check your camera preview, microphone input and local recording before an interview, class or video meeting.'));
const $=App.$,app=$('app');app.innerHTML=`<div class="panel"><div class="mini-label">Camera preview</div><div class="output-preview" style="margin-top:12px;background:#07152b;min-height:230px"><video id="camera" autoplay muted playsinline style="width:100%;max-height:430px;object-fit:contain;border-radius:10px;background:#07152b"></video><div id="cameraPlaceholder" style="color:#c5d2e4;text-align:center;padding:24px">Camera preview will appear here after you allow access.</div></div><div class="button-row" style="margin-top:13px"><button id="cameraStart" class="primary">Start camera</button><button id="cameraStop" class="secondary" disabled>Stop camera</button></div><div id="cameraStatus" class="status-line" role="status" aria-live="polite"></div></div>
<div class="panel"><div class="mini-label">Microphone test</div><div style="background:#07152b;border-radius:12px;margin:12px 0;padding:10px"><canvas id="meter" width="900" height="90" style="display:block;width:100%;height:70px"></canvas></div><div class="button-row"><button id="micStart" class="primary">Start microphone test</button><button id="micStop" class="secondary" disabled>Stop microphone</button></div><div id="micStatus" class="status-line" role="status" aria-live="polite">Speak normally after allowing microphone access. The meter does not record or transmit your audio.</div></div>
<div class="panel"><div class="mini-label">Record a short test clip</div><p class="muted">Start the camera and/or microphone first. Recording happens in the browser; no stream or recording is uploaded.</p><div class="control-grid"><label class="field">Recording length<select id="length"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="20">20 seconds</option><option value="30">30 seconds</option></select></label><label class="field">File name<input id="recordName" value="device-test" maxlength="60"></label></div><div class="button-row" style="margin-top:14px"><button id="record" class="primary" disabled>Start recording</button><button id="stopRecord" class="secondary" disabled>Stop & save</button></div><progress id="recProgress" max="100" value="0" hidden style="width:100%;margin-top:14px"></progress><div id="recordStatus" class="status-line" role="status" aria-live="polite"></div><video id="playback" controls playsinline hidden style="width:100%;max-height:360px;margin-top:10px;border-radius:12px;background:#07152b"></video><audio id="audioPlayback" controls hidden style="width:100%;margin-top:12px"></audio></div>
<div class="hint-box"><b>Compatibility:</b> camera and microphone permissions normally require HTTPS (or localhost during development). If access is blocked, check browser permissions and close other apps using the device. Some browsers cannot record video in every file format; the page checks supported formats before recording.</div>`;
let videoStream=null,audioStream=null,audioContext=null,analyser=null,micRAF=0,recorder=null,chunks=[],recordTimer=null,recordStarted=0;const video=$('camera'),meter=$('meter'),mctx=meter.getContext('2d');
function setStatus(id,text,err=false){$(id).textContent=text;$(id).className='status-line'+(err?' error':'')}
async function getMedia(constraints){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('This browser does not provide camera or microphone access. Open the site in an up-to-date browser over HTTPS.');return navigator.mediaDevices.getUserMedia(constraints)}
$('cameraStart').onclick=async()=>{try{if(videoStream)return;setStatus('cameraStatus','Requesting camera permission…');videoStream=await getMedia({video:{facingMode:'user'},audio:false});video.srcObject=videoStream;$('cameraPlaceholder').hidden=true;$('cameraStart').disabled=true;$('cameraStop').disabled=false;updateRecordState();setStatus('cameraStatus','Camera is working. Your preview stays in this browser.')}catch(e){videoStream=null;setStatus('cameraStatus',e.message||'Could not start the camera.',true)}};
$('cameraStop').onclick=()=>{if(videoStream)videoStream.getTracks().forEach(t=>t.stop());videoStream=null;video.srcObject=null;$('cameraPlaceholder').hidden=false;$('cameraStart').disabled=false;$('cameraStop').disabled=true;updateRecordState();setStatus('cameraStatus','Camera stopped.')};
function drawMeter(){if(!analyser)return;const n=analyser.fftSize,data=new Uint8Array(n);analyser.getByteTimeDomainData(data);mctx.clearRect(0,0,meter.width,meter.height);mctx.strokeStyle='#15304d';mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(0,meter.height/2);mctx.lineTo(meter.width,meter.height/2);mctx.stroke();mctx.strokeStyle='#45d7b2';mctx.lineWidth=3;mctx.beginPath();for(let i=0;i<data.length;i++){const x=i/(data.length-1)*meter.width,y=data[i]/255*meter.height;if(i===0)mctx.moveTo(x,y);else mctx.lineTo(x,y)}mctx.stroke();micRAF=requestAnimationFrame(drawMeter)}
$('micStart').onclick=async()=>{try{if(audioStream)return;setStatus('micStatus','Requesting microphone permission…');audioStream=await getMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioContext=new AC();const source=audioContext.createMediaStreamSource(audioStream);analyser=audioContext.createAnalyser();analyser.fftSize=1024;source.connect(analyser);drawMeter()}$('micStart').disabled=true;$('micStop').disabled=false;updateRecordState();setStatus('micStatus','Speak into the microphone. If the meter moves, input is being received locally.')}catch(e){audioStream=null;setStatus('micStatus',e.message||'Could not start the microphone.',true)}};
$('micStop').onclick=async()=>{if(audioStream)audioStream.getTracks().forEach(t=>t.stop());audioStream=null;analyser=null;if(micRAF)cancelAnimationFrame(micRAF);if(audioContext){await audioContext.close().catch(()=>{});audioContext=null;}mctx.clearRect(0,0,meter.width,meter.height);$('micStart').disabled=false;$('micStop').disabled=true;updateRecordState();setStatus('micStatus','Microphone stopped.')};
function combined(){return new MediaStream([...(videoStream?videoStream.getVideoTracks():[]),...(audioStream?audioStream.getAudioTracks():[])]);}
function updateRecordState(){const has=!!((videoStream&&videoStream.getVideoTracks().length)||(audioStream&&audioStream.getAudioTracks().length));$('record').disabled=!has||!!recorder;}
function supportedMime(){const hasVideo=!!(videoStream&&videoStream.getVideoTracks().length);const choices=hasVideo?['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']:['audio/webm;codecs=opus','audio/webm','audio/mp4'];if(!window.MediaRecorder)return '';return choices.find(t=>MediaRecorder.isTypeSupported(t))||''}
$('record').onclick=()=>{try{if(typeof MediaRecorder==='undefined')throw new Error('This browser does not support in-browser recording.');const stream=combined();if(!stream.getTracks().length)throw new Error('Start the camera or microphone first.');const mime=supportedMime();if(!mime)throw new Error('This browser does not report a compatible recording format. Try Chrome, Edge or an up-to-date Safari.');chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onerror=e=>setStatus('recordStatus',e.error?.message||'Recording failed.',true);recorder.onstop=async()=>{clearInterval(recordTimer);$('recProgress').hidden=true;const type=recorder?.mimeType||mime,blob=new Blob(chunks,{type});const ext=type.includes('mp4')?'mp4':type.startsWith('audio/')?'webm':'webm';if(type.startsWith('audio/')){$('audioPlayback').src=URL.createObjectURL(blob);$('audioPlayback').hidden=false;$('playback').hidden=true}else{$('playback').src=URL.createObjectURL(blob);$('playback').hidden=false;$('audioPlayback').hidden=true}const name=($('recordName').value.trim().replace(/[\\/:*?"<>|]+/g,'-')||'device-test')+'.'+ext;try{await App.save(blob,name);setStatus('recordStatus','Recording ready and save/share was opened.')}catch(e){setStatus('recordStatus','Recording is ready, but automatic saving failed. Use the browser share or download option.',true)}recorder=null;chunks=[];updateRecordState();$('record').disabled=false;$('stopRecord').disabled=true;};recorder.start(250);recordStarted=Date.now();$('record').disabled=true;$('stopRecord').disabled=false;$('recProgress').hidden=false;$('recProgress').value=0;setStatus('recordStatus','Recording… keep speaking or stay in the camera frame.');recordTimer=setInterval(()=>{const limit=(+$('length').value)*1000,elapsed=Date.now()-recordStarted;$('recProgress').value=Math.min(100,elapsed/limit*100);if(elapsed>=limit&&recorder&&recorder.state==='recording')recorder.stop()},150);}catch(e){setStatus('recordStatus',e.message||'Could not start recording.',true)}};
$('stopRecord').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop()};
window.addEventListener('beforeunload',()=>{[videoStream,audioStream].filter(Boolean).forEach(s=>s.getTracks().forEach(t=>t.stop()));if(audioContext)audioContext.close().catch(()=>{})});
</script></body></html>
